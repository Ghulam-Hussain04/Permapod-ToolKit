version: "3.9"
services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    container_name: permapod-frontend
    ports:
      - "${PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - permapod_net

  bot:
    build:
      context: ./Bot
      dockerfile: Dockerfile.bot
    container_name: permapod-bot
    env_file:
      - .env
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL}
      - OPENAI_MODEL=${OPENAI_MODEL}
      - OPENAI_VISION_MODEL=${OPENAI_VISION_MODEL}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5499
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    restart: unless-stopped
    volumes:
      - chroma_data:/app/chroma_data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - permapod_net



    
  # ── PostgreSQL ────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5499:5499"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - permapod_net
 
# ── Volumes ───────────────────────────────────────
volumes:
  postgres_data:   # persists all approved tweets across rebuilds
  chroma_data:     # persists ChromaDB embeddings across rebuilds
 
# ── Network ───────────────────────────────────────
networks:
  permapod_net:
    driver: bridge
   
