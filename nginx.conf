# ─────────────────────────────────────────────────
# nginx.conf — Permapod X Content Manager
# ─────────────────────────────────────────────────

# Explicitly set correct MIME types (critical for ES modules)
types {
    text/html                   html htm;
    text/css                    css;
    application/javascript      js mjs;
    application/json            json;
    image/png                   png;
    image/jpeg                  jpg jpeg;
    image/webp                  webp;
    image/svg+xml               svg;
    image/x-icon                ico;
    font/woff                   woff;
    font/woff2                  woff2;
    font/ttf                    ttf;
}

server {
    listen       8080;
    server_name  localhost;

    root  /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JS — must be served as application/javascript for ES modules to work
    location ~* \.js$ {
        add_header Content-Type "application/javascript";
        expires 1d;
        add_header Cache-Control "public";
    }

    # CSS
    location ~* \.css$ {
        add_header Content-Type "text/css";
        expires 1d;
        add_header Cache-Control "public";
    }

    # Other static assets
    location ~* \.(woff2|woff|ttf|svg|png|jpg|ico|webp)$ {
        expires 1d;
        add_header Cache-Control "public";
    }

    # Security headers
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy        "strict-origin" always;
}